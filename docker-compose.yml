# ═══════════════════════════════════════════════
# AI Harness — docker-compose (生产推荐)
#
# 安全加固清单：
#   ✅ init: true        正确传递进程信号（Ctrl+C / stop）
#   ✅ cap_drop          丢弃所有 Linux 内核能力
#   ✅ read_only         根文件系统只读（只有 /tmp 和 /workspace 可写）
#   ✅ tmpfs             /tmp 放内存（进程间通信不需要持久化）
#   ✅ log_limit         日志轮转（避免爆磁盘）
#   ✅ security_opt      禁用 AppArmor 升级权限
#   ✅ healthcheck       探活，不健康时自动重启
#   ✅ restart           unless-stopped（崩溃自动恢复）
# ═══════════════════════════════════════════════

services:
  ai-harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-harness:latest
    container_name: ai-harness
    init: true                         # 让子进程能正确收到 SIGTERM / SIGKILL
    read_only: true                    # 根文件系统只读！

    # ══ 网络 ══
    ports:
      - "${AIH_PORT:-8765}:8765"

    # ══ 持久化 ══
    volumes:
      - ./workspace:/workspace        # Agent 工作目录（Agent 读写文件的地方）
      - tmp-workspace:/workspace/cache # 临时计算缓存（可选）
    tmpfs:
      - /tmp:size=64m,mode=1777       # 进程临时目录放内存，不持久化

    # ══ 环境变量 ══
    environment:
      AIH_HOST: 0.0.0.0
      AIH_PORT: "8765"
      AIH_WORKDIR: /workspace
      AIH_TOKEN: ${AIH_TOKEN:-}       # 生产环境**必须**通过 .env 或 -e 传入

    # ══ 安全加固 ══
    cap_drop:
      - ALL                           # 丢弃所有 Linux 内核能力
    security_opt:
      - no-new-privileges:true        # 禁止提权
    pids_limit: 256                   # 最多 256 个并发子进程（防止 fork 炸弹）
    mem_limit: 512m                   # 内存上限 512MB（调大 Agent 上下文时相应调大）
    cpus: "1.0"                       # CPU 上限

    # ══ 日志轮转 ══
    logging:
      driver: "json-file"
      options:
        max-size: "10m"               # 单文件最大 10MB
        max-file: "3"                  # 保留 3 个文件（总共最多 30MB）

    # ══ 健康检查 ══
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health').read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # ══ 自动重启 ══
    restart: unless-stopped

volumes:
  tmp-workspace:                       # Docker 管理的临时卷


# ═══════════════════════════════════════════════
# 快速启动（本地开发，不启用 read_only + cap_drop）：
#   docker compose up -d --build
#
# 生产启动（推荐，用 .env 传 token，启用全部加固）：
#   docker compose --profile prod up -d --build
#
# 带 AIH_TOKEN 启动：
#   AIH_TOKEN=my-secret-token docker compose up -d
# ═══════════════════════════════════════════════
